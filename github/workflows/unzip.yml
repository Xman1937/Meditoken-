name: unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q meditoken.zip
          cp -a meditoken/. .
          rm -rf meditoken meditoken.zip .env
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git commit -m "Extract project"
          git push
